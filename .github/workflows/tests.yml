# The checks anyone can watch: they run on every push and every pull request,
# and the result is visible on the repository page without downloading anything.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:        # a "Run workflow" button, to start them by hand

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python packages
        # numpy and pillow are what the checks themselves need; the neural nets
        # are not installed here — the suite covers the paths without them too.
        run: python -m pip install --upgrade pip numpy pillow

      - name: Install jsdom and puppeteer
        working-directory: app
        run: npm install --no-audit --no-fund jsdom puppeteer

      - name: Run the whole suite
        working-directory: app
        # A silent skip of the browser suites would look green; here it is a
        # failure, because the point of running on a server is running it all.
        env:
          KARAOKE_REQUIRE_BROWSER: "1"
        run: python tests/run_all.py

  models:
    # The real Whisper and Demucs: they download models, so this job is separate
    # and does not hold up the fast one.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install the neural nets
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy soundfile "stable-ts>=2.17" "demucs>=4.0" \
            --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Align and separate for real
        env:
          KARAOKE_HEAVY: "1"
        run: python3 app/tests/test_heavy.py

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build the image and make a song inside it
        env:
          KARAOKE_DOCKER: "1"
        run: python3 app/tests/test_container.py
