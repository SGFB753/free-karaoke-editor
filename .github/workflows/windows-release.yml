name: Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v4.46.0"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            app/requirements-build.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Create build environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r app\requirements.txt imageio-ffmpeg
      - name: Test pipeline and interface
        shell: pwsh
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
          KARAOKE_REQUIRE_BROWSER: "1"
        run: |
          Push-Location app
          npm install --no-audit --no-fund
          Pop-Location
          .\.venv\Scripts\python.exe app\tests\run_all.py
      - name: Build self-contained application
        shell: pwsh
        run: |
          $version = (.\.venv\Scripts\python.exe -c "import sys; sys.path.insert(0, 'app'); import kstudio; print(kstudio.__version__)").Trim()
          if ($env:RELEASE_TAG -ne "v$version") { throw "Tag must be v$version" }
          # Libraries and ffmpeg stay self-contained. Model weights download
          # once on first use and then live in the user's cache; carrying them
          # in every GitHub release only makes uploads slower and less reliable.
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\app\packaging\build-windows.ps1 -Repository '${{ github.repository }}' -SkipTests
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: pwsh
        run: |
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $env:TAG --title $env:TAG --generate-notes }
          gh release upload $env:TAG dist\KaraokeStudio-windows-x64.zip dist\KaraokeStudio-windows-x64.zip.sha256 --clobber
