<!DOCTYPE html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%230a0b14%22%2F%3E%3Crect%20x%3D%2213%22%20y%3D%226%22%20width%3D%226%22%20height%3D%2212%22%20rx%3D%223%22%20fill%3D%22%234de1ff%22%2F%3E%3Cpath%20d%3D%22M10%2015a6%206%200%200%200%2012%200%22%20fill%3D%22none%22%20stroke%3D%22%234de1ff%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M16%2021v4M13%2025h6%22%20stroke%3D%22%234de1ff%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<style>
  :root{
    --bg:#0a0b14; --bg2:#141830; --panel:rgba(255,255,255,.06); --line:rgba(255,255,255,.12);
    --dim:#5d6480; --text:#e8ebf5; --muted:#8b93b0;
    --accent:#4de1ff; --accent2:#ffcc4d; --sung:#7f88ab;
    --stage-size:clamp(29px, 5.8vw, 65px);
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text); overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased; user-select:none;
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(900px 600px at 15% -10%, rgba(77,225,255,.14), transparent 60%),
      radial-gradient(800px 600px at 85% 110%, rgba(255,204,77,.10), transparent 60%),
      linear-gradient(180deg,var(--bg) 0%, var(--bg2) 100%);
    transition:opacity .6s;
  }
  body.playing::before{opacity:1}
  .app{position:relative; z-index:1; height:100%; display:flex; flex-direction:column}

  /* ---------- шапка ---------- */
  header{
    display:flex; align-items:center; gap:14px; padding:14px 20px;
    border-bottom:1px solid var(--line); flex:none;
  }
  .meta{min-width:0; flex:1}
  .meta h1{font-size:23px; font-weight:750; letter-spacing:-.3px; line-height:1.2;
           white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .meta p{font-size:15px; color:var(--muted); margin-top:2px; white-space:nowrap;
          overflow:hidden; text-overflow:ellipsis}

  /* ---------- сцена с текстом ---------- */
  .stage{flex:1; position:relative; overflow:hidden; -webkit-mask-image:
      linear-gradient(180deg,transparent 0,#000 14%,#000 84%,transparent 100%);
      mask-image:linear-gradient(180deg,transparent 0,#000 14%,#000 84%,transparent 100%)}
  .scroll{position:absolute; left:0; right:0; top:0; padding:38vh 6vw 42vh;
          transition:transform .45s cubic-bezier(.22,.61,.36,1); will-change:transform}
  .ln{
    font-size:var(--stage-size); line-height:1.24; font-weight:750; letter-spacing:-.4px;
    color:var(--dim); padding:.30em 0; cursor:pointer; text-align:center;
    transition:color .3s, opacity .3s, transform .35s; transform-origin:center;
    opacity:.42; text-wrap:balance;
  }
  .ln.done{opacity:.30; color:var(--sung)}
  .ln.next{opacity:.55}
  .ln.cur{opacity:1; color:var(--text); transform:scale(1.045)}
  /* Строка целиком в скобках — подпевка. Её пишут, чтобы было слышно
     бэк-вокал, поэтому и на экране она должна быть скромнее основной. */
  .ln.back{font-size:calc(var(--stage-size) * .72); font-style:italic;
           letter-spacing:0}
  .ln.back.cur{transform:scale(1.02)}
  /* Строка, которую поёт оригинал: здесь голос из записи не убирается.
     Подпевка, речь, важный для сюжета кусок — петь его не нужно, и это
     должно быть видно заранее, а не выясняться на слух. */
  .ln.keep .kp{font-size:.42em; font-style:normal; font-weight:600;
    letter-spacing:.08em; text-transform:uppercase; vertical-align:middle;
    color:var(--accent-2); border:1px solid currentColor; border-radius:999px;
    padding:.18em .5em; margin-left:.5em; opacity:.75; white-space:nowrap}
  .ln.keep.cur{text-shadow:0 0 24px color-mix(in srgb, var(--accent-2) 45%, transparent)}
  /* Заливка слова — не градиент по буквам, а второй слой поверх, обрезанный по
     ширине. Меняется только ширина: браузер не перерисовывает текст каждый кадр,
     и подсветка не мерцает. */
  .ln .w{position:relative; display:inline-block; white-space:pre}
  .ln .w .hl{
    position:absolute; left:0; top:0; width:0; overflow:hidden; white-space:pre;
    color:var(--accent); pointer-events:none;
  }
  /* Второй голос — своим цветом: видно, кто поёт и где сменилась манера. */
  .ln.v2 .w .hl{color:var(--accent-2)}
  /* Два голоса разом. Строки стоят одна под другой, но по центру они читаются
     как одна каша: глазу не за что зацепиться. Разводим их по сторонам —
     основной голос влево, второй вправо, — и оставляем метку с цифрой. */
  .ln.duo{transform:none !important; transition:transform .25s, margin .25s}
  .ln.duo.cur{opacity:1}
  .ln.duo:not(.v2){text-align:left; padding-left:6vw; padding-right:22vw}
  .ln.duo.v2{text-align:right; padding-right:6vw; padding-left:22vw}
  .ln.duo::before{content:"1"; font-size:.42em; font-weight:700; opacity:.55;
    vertical-align:middle; margin-right:.5em; color:var(--accent)}
  .ln.duo.v2::before{content:"2"; color:var(--accent-2); margin-right:0;
    margin-left:.5em; float:right}
  @media (max-width: 700px){
    .ln.duo:not(.v2){padding-right:10vw}
    .ln.duo.v2{padding-left:10vw}
  }
  .ln.cur .w{color:rgba(232,235,245,.34)}
  .sect{font-size:12px; font-weight:600; letter-spacing:2.5px; text-transform:uppercase;
        color:var(--accent2); opacity:.62; text-align:center; padding:1.1em 0 .2em}
  /* обратный отсчёт перед вступлением строки */
  .pips{display:flex; gap:8px; justify-content:center; align-items:center; height:14px}
  .pips span{width:9px; height:9px; border-radius:50%; background:var(--line);
             transform:scale(.8); transition:background .15s, transform .15s}
  .pips span.on{background:var(--accent); transform:scale(1.25)}
  .empty{position:absolute; inset:0; display:grid; place-items:center; color:var(--muted);
         font-size:15px}

  /* ---------- низ ---------- */
  footer{flex:none; padding:12px 20px 16px; border-top:1px solid var(--line);
         background:rgba(10,11,20,.55); backdrop-filter:blur(12px)}
  .bar{display:flex; align-items:center; gap:12px; font-variant-numeric:tabular-nums;
       font-size:12px; color:var(--muted)}
  .seek{flex:1; position:relative; height:22px; display:flex; align-items:center; cursor:pointer}
  .seek .track{height:5px; width:100%; border-radius:99px; background:rgba(255,255,255,.11);
               overflow:hidden}
  .seek .fill{height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--accent2));
              border-radius:99px}
  .seek .knob{position:absolute; top:50%; width:13px; height:13px; border-radius:50%;
              background:#fff; transform:translate(-50%,-50%); left:0; opacity:0; transition:opacity .2s;
              box-shadow:0 2px 8px rgba(0,0,0,.5)}
  .seek:hover .knob{opacity:1}

  .controls{display:flex; align-items:center; gap:10px; margin-top:12px; flex-wrap:wrap}
  button{
    font:inherit; font-size:13px; color:var(--text); background:var(--panel);
    border:1px solid var(--line); border-radius:10px; padding:8px 12px; cursor:pointer;
    display:inline-flex; align-items:center; gap:7px; transition:background .15s, border-color .15s;
  }
  button:hover{background:rgba(255,255,255,.11)}
  button:active{transform:translateY(1px)}
  button.on{background:rgba(77,225,255,.16); border-color:rgba(77,225,255,.45); color:#bff2ff}
  button.play{width:46px; height:46px; padding:0; justify-content:center; border-radius:50%;
              background:var(--text); color:#0a0b14; border:none}
  button.play:hover{background:#fff}
  .spacer{flex:1}
  .knobgrp{display:flex; align-items:center; gap:9px; font-size:12px; color:var(--muted);
           background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:6px 12px}
  input[type=range]{-webkit-appearance:none; appearance:none; height:4px; border-radius:99px;
    background:rgba(255,255,255,.18); outline:none; width:110px}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:14px; height:14px;
    border-radius:50%; background:var(--accent); cursor:pointer}
  input[type=range]::-moz-range-thumb{width:14px; height:14px; border:none; border-radius:50%;
    background:var(--accent); cursor:pointer}
  .val{min-width:62px; text-align:right; color:var(--text); font-variant-numeric:tabular-nums}
  #vVocal{min-width:38px}
  #tCur{min-width:74px; text-align:right}

  /* ---------- панель правки ---------- */
  .editor{display:none; margin-top:12px; padding:14px; border:1px solid var(--line);
          border-radius:12px; background:rgba(0,0,0,.28); font-size:13px}
  .editor.open{display:block}
  .editor .row{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px}
  .editor .row:last-child{margin-bottom:0}
  .editor .hint{color:var(--muted); font-size:12px; line-height:1.6}
  kbd{font:inherit; font-size:11px; background:rgba(255,255,255,.1); border:1px solid var(--line);
      border-bottom-width:2px; border-radius:5px; padding:1.5px 6px}
  .editor .row.second button{font-size:12px; padding:6px 10px; opacity:.72}
  .editor .row.second button:hover{opacity:1}
  .editor .row.second button.on{opacity:1}
  .chk{display:inline-flex; align-items:center; gap:6px; font-size:12.5px;
       color:var(--muted); cursor:pointer}
  .toast{position:fixed; left:50%; bottom:120px; transform:translateX(-50%) translateY(10px);
         background:rgba(20,24,48,.96); border:1px solid var(--line); color:var(--text);
         padding:10px 18px; border-radius:10px; font-size:13px; opacity:0; pointer-events:none;
         transition:opacity .25s, transform .25s; z-index:50}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  /* Строка, которую сейчас правят кнопками. Метку показываем только при
     открытой панели правки и рисуем короткой чертой под текстом — полоса во
     всю ширину экрана мешала смотреть караоке. */
  .ln.tgt::after{content:""; position:absolute; left:50%; bottom:.1em; width:52px;
    height:3px; transform:translateX(-50%); background:var(--accent2);
    border-radius:2px; opacity:.85}
  body.editing .ln.tgt{position:relative}
  body:not(.editing) .ln.tgt::after{display:none}
  .tgtName{font-size:12.5px; color:var(--accent2); max-width:38ch; overflow:hidden;
           text-overflow:ellipsis; white-space:nowrap; font-variant-numeric:tabular-nums}
  #btnTgtPrev, #btnTgtNext{padding:6px 11px}
  .hide{display:none !important}
  /* Закреплённую цель видно и по подписи: её держат руками, песня её не двигает. */
  .row.held .tgtName{text-decoration:underline; text-underline-offset:3px}
  #btnUnpin{padding:6px 10px; font-size:12px; color:var(--muted)}

  body.tapping .ln.cur{color:var(--accent2)}
  body.tapping .ln.cur .w{color:var(--accent2)}
  body.tapping .ln.cur .w .hl{display:none}
  @media (max-width:640px){
    .controls{gap:8px} .knobgrp{padding:5px 9px} input[type=range]{width:74px}
    header{padding:10px 14px} footer{padding:10px 12px 14px}
    /* Низ на телефоне высокий: подпись снизу накрывала кнопку пуска. */
    .toast{bottom:auto; top:14px; max-width:88vw}
  }
  @media print{body{display:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="meta"><h1 id="mTitle">—</h1><p id="mArtist"></p></div>
  </header>

  <div class="stage" id="stage">
    <div class="scroll" id="scroll"></div>
  </div>

  <footer>
    <div class="bar">
      <span id="tCur">0:00</span>
      <div class="seek" id="seek">
        <div class="track"><div class="fill" id="seekFill"></div></div>
        <div class="knob" id="seekKnob"></div>
      </div>
      <span id="tDur">0:00</span>
    </div>

    <div class="controls">
      <button class="play" id="btnPlay" data-tt="playHint" title="Space">
        <svg id="icPlay" width="16" height="18" viewBox="0 0 16 18" fill="currentColor"><path d="M1 1.6c0-.8.9-1.3 1.6-.9l11.6 6.9c.6.4.6 1.3 0 1.7L2.6 17.3c-.7.4-1.6-.1-1.6-.9V1.6z"/></svg>
        <svg id="icPause" width="14" height="17" viewBox="0 0 14 17" fill="currentColor" style="display:none"><rect x="0" y="0" width="4.5" height="17" rx="1.4"/><rect x="9.5" y="0" width="4.5" height="17" rx="1.4"/></svg>
      </button>

      <div class="knobgrp" id="grpVocal" data-tt="voiceHint" title="0% — instrumental only, 100% — original">
        <span data-t="voice">Voice</span>
        <input type="range" id="rVocal" min="0" max="100" value="0">
        <span class="val" id="vVocal">0%</span>
      </div>

      <div class="knobgrp" data-tt="offsetHint" title="Shift the lyrics against the music">
        <span data-t="offset">Offset</span>
        <input type="range" id="rOffset" min="-3000" max="3000" step="10" value="0">
        <span class="val" id="vOffset">0.0s</span>
      </div>

      <div class="spacer"></div>
      <button id="btnSize" data-tt="sizeHint" title="Text size">Aa</button>
      <button id="btnLang" data-tt="langHint" title="Interface language">EN</button>
      <button id="btnEdit" data-t="edit">Edit</button>
      <button id="btnFull" title="F" data-t="fullscreen">Full screen</button>
    </div>

    <div class="editor" id="editor">
      <div class="row" id="tgtRow">
        <span class="hint" data-t="editingLine">Editing line:</span>
        <button id="btnTgtPrev" data-tt="linePrev" title="Line above">◀</button>
        <span class="tgtName" id="tgtName">—</span>
        <button id="btnTgtNext" data-tt="lineNext" title="Line below">▶</button>
        <button id="btnUnpin" class="hide" data-tt="unpinHint" title="Release — the target follows the song again"><span data-t="unpin">not this one</span></button>
      </div>
      <div class="row">
        <button id="btnHere" class="on" data-t="lineStartsHere">⌖ Line starts here</button>
        <label class="chk"><input type="checkbox" id="chkRest"> <span data-t="andRest">and all after it</span></label>
        <button id="btnUndo" data-t="undo">Undo</button>
      </div>
      <div class="row"><div class="hint" data-t="editHint"></div></div>
      <div class="row second">
        <button id="btnTap" data-t="tapMode">Tap along</button>
        <button id="btnSavePage" data-t="savePage">⬇ Save page with edits</button>
        <button id="btnSaveJson">.json</button>
        <button id="btnSaveLrc">.lrc</button>
        <button id="btnReset" data-t="resetAll">Reset everything</button>
      </div>
      <div class="row hide" id="tapRow"><div class="hint" id="tapHint" data-t="tapHint"></div></div>
    </div>
  </footer>
</div>

<div class="toast" id="toast"></div>
<script id="payload" type="application/json">__PAYLOAD__</script>
<script>
(function(){
"use strict";
const P = JSON.parse(document.getElementById("payload").textContent);
const D = P.data;

/* ---------- язык страницы ----------
   Страница уезжает к людям, у которых родной язык не обязательно русский.
   Все видимые надписи собраны здесь; язык берётся из настройки сборки, а если
   она «auto» — из языка браузера. Английский по умолчанию: он понятен шире. */
const STR = {
  en: {
    voice: "Voice", offset: "Offset", edit: "Edit", fullscreen: "Full screen",
    editingLine: "Editing line:", unpin: "not this one",
    lineStartsHere: "⌖ Line starts here", andRest: "and all after it",
    undo: "Undo", tapMode: "Tap along", savePage: "⬇ Save page with edits",
    resetAll: "Reset everything", noLyrics: "No lyrics",
    sungByOriginal: "original sings",
    langHint: "Interface language", langSwitched: "Interface language: Русский",
    voiceHint: "0% — instrumental only, 100% — original",
    offsetHint: "Shift the lyrics against the music",
    sizeHint: "Text size", linePrev: "Line above", lineNext: "Line below",
    unpinHint: "Release — the target follows the song again",
    editHint: 'Play up to where the line starts being sung and press ' +
      '<b>“Line starts here”</b>. Fine-tune with <kbd>[</kbd> and <kbd>]</kbd> ' +
      'by 50 ms. The “Offset” slider moves the whole text at once. ' +
      'Nothing can be ruined: “Undo” steps back.',
    tapHint: '<b>Tap along.</b> The song rewinds to the start and the text stops ' +
      'following the clock. <kbd>Space</kbd> starts playback, every next ' +
      '<kbd>Space</kbd> marks the start of the current line. Missed one — ' +
      '<kbd>Backspace</kbd> goes one line back. You can also click any line ' +
      'and continue from there.',
    tapOff: "Tap along", tapOn: (i, n) => `Tapping: line ${i} of ${n}`,
    saveUnsaved: "⬇ Save page with edits (unsaved changes)",
    savedOk: "Page saved. Make the video from it.",
    undone: "Undone", nothingToUndo: "Nothing to undo",
    resetDone: "Timings are back to the original",
    restored: "Your edits are back. To get the machine timings: “Edit” → “Reset everything”",
    unpinned: "The target follows the song again",
    playFirst: "Play up to the line you need first",
    movedRest: (i, d) => `Moved lines from ${i} to the end by ${d > 0 ? "+" : ""}${d}s`,
    movedOne: (i, d) => `Line ${i}: ${d > 0 ? "+" : ""}${d}s`,
    jsonSaved: "Ready — this file can be fed to the script with --timings",
    tapFrom: (i) => `Marking from line ${i} — Space starts the song`,
    tapHow: "Space — start playback, then Space at the beginning of each line",
    sec: "s", playHint: "Space",
    noAudio: "Web Audio unavailable", blocked: "The browser blocked playback — press again",
    backTo: (i) => `Back to line ${i}`, allTapped: "All lines are marked already",
    tapDone: "Done — turn tap mode off", karaokeTitle: "Karaoke",
    badAudio: "Could not prepare the audio", tapSaved: "Timings saved",
  },
  ru: {
    voice: "Голос", offset: "Сдвиг", edit: "Правка", fullscreen: "На весь экран",
    editingLine: "Правим строку:", unpin: "не эту",
    lineStartsHere: "⌖ Начало строки — сюда", andRest: "и все следующие",
    undo: "Отменить", tapMode: "Разметка по тапам",
    savePage: "⬇ Сохранить страницу с правками",
    resetAll: "Сбросить всё", noLyrics: "Текст не задан",
    sungByOriginal: "поёт оригинал",
    langHint: "Язык надписей", langSwitched: "Язык надписей: English",
    voiceHint: "0 % — чистая минусовка, 100 % — оригинал",
    offsetHint: "Сдвиг текста относительно музыки",
    sizeHint: "Размер текста", linePrev: "Взять строку выше",
    lineNext: "Взять строку ниже",
    unpinHint: "Снять выбор — цель снова пойдёт за песней",
    editHint: 'Доиграйте до места, где строку начинают петь, и нажмите ' +
      '<b>«Начало строки — сюда»</b>. Подкрутить точнее — клавиши ' +
      '<kbd>[</kbd> и <kbd>]</kbd> по 50 мс. Весь текст сразу двигает ползунок ' +
      '«Сдвиг». Испортить нельзя: «Отменить» возвращает по шагу назад.',
    tapHint: '<b>Разметка по тапам.</b> Песня перемотается на начало, текст встанет ' +
      'на первой строке и сам листать не будет. <kbd>Пробел</kbd> запускает ' +
      'проигрывание, каждый следующий <kbd>Пробел</kbd> отмечает начало текущей ' +
      'строки. Промахнулись — <kbd>Backspace</kbd> на строку назад. ' +
      'Можно щёлкнуть по любой строке и начать с неё.',
    tapOff: "Разметка по тапам", tapOn: (i, n) => `Тапы: строка ${i} из ${n}`,
    saveUnsaved: "⬇ Сохранить страницу с правками (есть несохранённые)",
    savedOk: "Страница сохранена. Из неё и делайте видео.",
    undone: "Отменено", nothingToUndo: "Нечего отменять",
    resetDone: "Тайминги вернулись к исходным",
    restored: "Открыты ваши правки. Вернуть машинную разметку: «Правка» → «Сбросить всё»",
    unpinned: "Цель снова идёт за песней",
    playFirst: "Сначала доиграйте до нужной строки",
    movedRest: (i, d) => `Сдвинул строки с ${i}-й до конца на ${d > 0 ? "+" : ""}${d}с`,
    movedOne: (i, d) => `Строка ${i}: ${d > 0 ? "+" : ""}${d}с`,
    jsonSaved: "Готово — этот файл можно скормить скрипту через --timings",
    tapFrom: (i) => `Отмечаем со строки ${i} — Пробел запускает песню`,
    tapHow: "Пробел — начать проигрывание, дальше Пробел в начале каждой строки",
    sec: "с", playHint: "Пробел",
    noAudio: "Web Audio недоступен",
    blocked: "Браузер не дал запустить звук — нажмите ещё раз",
    backTo: (i) => `Вернулся к строке ${i}`,
    allTapped: "Все строки уже размечены",
    tapDone: "Готово — выключите режим тапов", karaokeTitle: "Караоке",
    badAudio: "Не удалось подготовить звук", tapSaved: "Разметка сохранена",
  },
};
// Цвета подсветки: первый — основной вокал, второй — подпевка или иная манера
// (чистый / экстрим). Задаются при сборке, чтобы страница уехала уже нужной.
const COLORS = Array.isArray(P.colors) && P.colors.length
  ? P.colors : ["#4de1ff", "#ff8ad1"];
document.documentElement.style.setProperty("--accent", COLORS[0]);
document.documentElement.style.setProperty("--accent-2", COLORS[1] || COLORS[0]);

// Фон и цвет букв. Пару, в которой текст сливается с фоном, страница не берёт:
// читать её всё равно было бы нельзя.
function rgbOf(c){
  c = String(c || "").trim().replace("#", "");
  if (c.length === 3) c = c.split("").map(x => x + x).join("");
  if (!/^[0-9a-f]{6}$/i.test(c)) return null;
  return [0, 2, 4].map(i => parseInt(c.slice(i, i + 2), 16));
}
function lum(rgb){
  const f = v => (v /= 255) <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  return 0.2126 * f(rgb[0]) + 0.7152 * f(rgb[1]) + 0.0722 * f(rgb[2]);
}
function contrast(a, b){
  const ra = rgbOf(a), rb = rgbOf(b);
  if (!ra || !rb) return 21;
  const la = lum(ra), lb = lum(rb);
  return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
}
if (P.theme && P.theme.bg && P.theme.text && contrast(P.theme.bg, P.theme.text) >= 3){
  const root = document.documentElement.style;
  root.setProperty("--bg", P.theme.bg);
  root.setProperty("--bg2", P.theme.bg);
  root.setProperty("--text", P.theme.text);
  // Тусклые строки — тот же цвет, только приглушённый: иначе на светлом фоне
  // они остаются светло-серыми и не видны вовсе.
  const t = rgbOf(P.theme.text), b = rgbOf(P.theme.bg);
  const mixed = t.map((v, i) => Math.round(v * 0.55 + b[i] * 0.45));
  const hex = "#" + mixed.map(v => v.toString(16).padStart(2, "0")).join("");
  root.setProperty("--dim", hex);
  root.setProperty("--sung", hex);
  root.setProperty("--muted", hex);
}

// Язык надписей: сначала выбранный руками на этой странице, затем заданный при
// сборке, затем язык браузера. Английский — если ничего не подошло.
const LANG_KEY = "karaoke-lang-" + (P.id || "");
let LANG = (() => {
  try {
    const saved = localStorage.getItem(LANG_KEY);
    if (saved && STR[saved]) return saved;
  } catch (e) {}
  const want = (P.uiLang || "auto");
  if (STR[want]) return want;
  const nav = (navigator.language || "en").slice(0, 2).toLowerCase();
  return STR[nav] ? nav : "en";
})();
let T = STR[LANG];
document.documentElement.lang = LANG;
function applyLang(root){
  (root || document).querySelectorAll("[data-t]").forEach(e => {
    const v = T[e.dataset.t];
    if (typeof v === "string") e.innerHTML = v;
  });
  (root || document).querySelectorAll("[data-tt]").forEach(e => {
    const v = T[e.dataset.tt];
    if (typeof v === "string") e.title = v;
  });
}
applyLang();

const $ = id => document.getElementById(id);
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const fmt = s => { s=Math.max(0,s|0); return (s/60|0)+":"+String(s%60).padStart(2,"0"); };
// то же, но с миллисекундами — для правки разметки округление до секунды бесполезно
const fmtMs = s => { s=Math.max(0,s); const m=s/60|0, r=s-m*60;
  return m+":"+(r<10?"0":"")+r.toFixed(3); };

/* ---------- звук ----------
   Две дорожки в двух <audio> имеют независимые часы: они неизбежно расходятся,
   а любая попытка их подтягивать слышна — либо провалами от перемотки, либо
   плаванием скорости. Поэтому основной путь — Web Audio: обе дорожки идут от
   одного тактового генератора, и рассинхрон невозможен в принципе.
   Запасной путь на отдельных элементах остаётся на случай, когда декодировать
   не вышло — например, звук лежит отдельными файлами и открыт через file://.
*/
const stems = !!(P.audio.instrumental && P.audio.vocals);
let engine = "loading";                  // loading | wa | el
let vocalLevel = stems ? 0 : 1;          // 0 = минус, 1 = оригинал
let offset = 0, dur = D.duration || 0, sizeStep = 0;
let pendingPlay = false, pendingSeek = null;

let ctx = null, bufs = null, srcs = null, gains = null;   // Web Audio
let waStart = 0, waOffset = 0, waOn = false;
let master = null, voice = null;                          // запасной путь
let lines = D.lines.map(l => ({...l, words: l.words.map(w => ({...w}))}));
const KEY = "karaoke:" + P.id;
const history = [];

/* ---------- отрисовка текста ---------- */
const scroll = $("scroll");
const lineEls = [];
function build(){
  scroll.innerHTML = "";
  lineEls.length = 0;
  pipLine = -1; pipCount = 0;      // старые точки ушли вместе со старым DOM
  shownTarget = -2;                // подсветка цели тоже жила в старом DOM
  if (!lines.length){
    scroll.innerHTML = `<div class="empty">${T.noLyrics}</div>`;
    return;
  }
  lines.forEach((ln, i) => {
    if (ln.section){
      const s = document.createElement("div");
      s.className = "sect"; s.textContent = ln.section;
      scroll.appendChild(s);
    }
    const pips = document.createElement("div");
    pips.className = "pips";
    pips.innerHTML = "<span></span><span></span><span></span>";
    scroll.appendChild(pips);

    const el = document.createElement("div");
    el.className = "ln" + (ln.backing ? " back" : "") + (ln.voice === 2 ? " v2" : "")
      + (ln.keep ? " keep" : "");
    ln.words.forEach((w, j) => {
      const txt = w.w + (j < ln.words.length - 1 ? " " : "");
      const sp = document.createElement("span");
      sp.className = "w";
      const hl = document.createElement("span");   // яркий слой поверх тусклого
      hl.className = "hl";
      hl.textContent = txt;
      sp.appendChild(hl);
      sp.appendChild(document.createTextNode(txt));
      el.appendChild(sp);
    });
    el.addEventListener("click", () => {
      // в режиме тапов клик выбирает, С КАКОЙ строки продолжать отмечать
      if (tapping) { startFrom(i); return; }
      // При правке щелчок ЗАКРЕПЛЯЕТ строку: иначе цель приходилось угадывать
      // по времени перемотки, а перематываем мы чуть раньше начала — и цель
      // уезжала на предыдущую строку.
      if (document.body.classList.contains("editing")) pinLine(i);
      seekTo(Math.max(0, ln.start - 0.35));
    });
    if (ln.keep){
      const kp = document.createElement("i");
      kp.className = "kp";
      kp.textContent = T.sungByOriginal;
      el.appendChild(kp);
    }
    scroll.appendChild(el);
    // Метка «поёт оригинал» — не слово, подсвечивать её нечем.
    const spans = [...el.children].filter(e => e.classList.contains("w"));
    lineEls.push({el, pips, dots: [...pips.children], spans,
                  hls: spans.map(s => s.firstChild)});
  });
}

/* ---------- цикл синхронизации ---------- */
let curIdx = -1, raf = 0, pipLine = -1, pipCount = 0, shownTarget = -2;
let wasDuo = false;
function currentTime(){ return mediaTime() - offset; }

function findLine(t){
  // строка активна от своего начала до начала следующей
  let lo = 0, hi = lines.length - 1, res = -1;
  while (lo <= hi){
    const mid = (lo + hi) >> 1;
    if (lines[mid].start <= t){ res = mid; lo = mid + 1; } else hi = mid - 1;
  }
  return res;
}

function tick(){
  const t = currentTime();
  // В режиме тапов текст ведёт НЕ время, а сам пользователь: показываем ту строку,
  // которую он сейчас отмечает. Иначе плеер листает по старым — неверным —
  // таймингам и убегает вперёд от нажатий.
  let idx = tapping ? Math.min(tapIdx, lines.length - 1) : findLine(t);
  // Спели последнюю строку — подсветку снимаем: висящая до конца записи
  // строка выглядит забытой, будто плеер завис.
  if (!tapping && idx === lines.length - 1 && idx >= 0 && t > lines[idx].end + 0.25)
    idx = -1;

  // Голоса иногда накладываются: основной ещё тянет, подпевка уже вступила.
  // Показываем все строки, которые звучат сейчас, а не одну «текущую».
  const act = new Set();
  if (!tapping){
    for (let i = 0; i < lines.length; i++)
      if (lines[i].start <= t && t < lines[i].end) act.add(i);
  }
  if (idx >= 0) act.add(idx);

  // Разные голоса звучат одновременно — значит, их надо развести по сторонам.
  const voices = new Set([...act].map(i => lines[i].voice === 2 ? 2 : 1));
  const duo = act.size > 1 && voices.size > 1;

  if (idx !== curIdx || duo !== wasDuo){
    lineEls.forEach((L, i) => {
      L.el.className = "ln" + (lines[i].backing ? " back" : "")
        + (lines[i].voice === 2 ? " v2" : "")
        + (lines[i].keep ? " keep" : "")
        + (duo && act.has(i) ? " duo" : "")
        + (act.has(i) ? " cur" : i < idx ? " done" : i === idx + 1 ? " next" : "");
      if (i !== idx || tapping) L.hls.forEach(h => { h.style.width = "0"; });
    });
    curIdx = idx;
    wasDuo = duo;
    // className выше переписан целиком, вместе с меткой цели — просим
    // перерисовать её заново, иначе подчёркивание пропадает на каждой строке
    shownTarget = -2;
    // Показываем обе строки разом: центрируем по середине пары.
    centerLine(idx, duo ? [...act] : null);
  }
  refreshTarget();

  // Въехали в кусок с оригинальным голосом или выехали из него.
  const kp = stems && !tapping && inKeep(t);
  if (kp !== keepOn){ keepOn = kp; applyVocal(); document.body.classList.toggle("keeping", kp); }

  // Подсветку слов ведём по каждой звучащей строке, а не только по ведущей.
  if (!tapping) act.forEach(k => {
    if (k === idx) return;
    const L2 = lineEls[k], l2 = lines[k];
    for (let j = 0; j < l2.words.length; j++){
      const w = l2.words[j], hl = L2.hls[j];
      const p = w.d > 0 ? clamp((t - w.t) / w.d, 0, 1) : (t >= w.t ? 1 : 0);
      const want = p >= 1 ? "100%" : (p <= 0 ? "0px" : (p * 100).toFixed(1) + "%");
      if (hl.style.width !== want) hl.style.width = want;
    }
  });

  if (idx >= 0 && !tapping){
    const L = lineEls[idx], ln = lines[idx];
    for (let j = 0; j < ln.words.length; j++){
      const w = ln.words[j], hl = L.hls[j];
      const p = w.d > 0 ? clamp((t - w.t) / w.d, 0, 1) : (t >= w.t ? 1 : 0);
      const want = p >= 1 ? "100%" : (p <= 0 ? "0px" : (p * 100).toFixed(1) + "%");
      if (hl.style.width !== want) hl.style.width = want;   // пишем только при смене
    }
  }

  // отсчёт перед следующей строкой (если пауза больше 2,5 с);
  // трогаем DOM только когда точки реально меняются, а не каждый кадр
  const nxt = idx + 1;
  let wantLine = -1, wantCount = 0;
  if (!tapping && nxt < lines.length){
    const gap = lines[nxt].start - (idx >= 0 ? lines[idx].end : 0);
    const left = lines[nxt].start - t;
    if (gap > 2.5 && left > 0 && left <= 3){
      wantLine = nxt;
      wantCount = Math.min(3 - Math.ceil(left) + 1, 3);
    }
  }
  if (wantLine !== pipLine || wantCount !== pipCount){
    if (pipLine >= 0 && lineEls[pipLine])
      lineEls[pipLine].dots.forEach(d => d.classList.remove("on"));
    if (wantLine >= 0)
      lineEls[wantLine].dots.forEach((d, k) => d.classList.toggle("on", k < wantCount));
    pipLine = wantLine; pipCount = wantCount;
  }

  $("seekFill").style.width = (dur ? mediaTime() / dur * 100 : 0) + "%";
  $("seekKnob").style.left  = (dur ? mediaTime() / dur * 100 : 0) + "%";
  $("tCur").textContent = fmtMs(mediaTime());

  // Подтяжка дорожек нужна только запасному пути: в Web Audio они идут от одного
  // тактового генератора и разойтись не могут.
  if (engine === "el" && voice && wantPlaying && !master.paused && voice.paused
      && !voice.seeking && Date.now() - lastRevive > 300){
    lastRevive = Date.now();
    voice.currentTime = master.currentTime;
    const pr = voice.play();
    if (pr && pr.catch) pr.catch(() => {});
  }
  if (engine === "el" && voice && !voice.paused && !master.paused
      && !master.seeking && !voice.seeking){
    const drift = master.currentTime - voice.currentTime;
    if (Math.abs(drift) > 0.4){
      voice.currentTime = master.currentTime;
      voice.playbackRate = 1;
    } else if (Math.abs(drift) > 0.02){
      voice.playbackRate = clamp(1 + drift * 0.4, 0.98, 1.02);
    } else if (voice.playbackRate !== 1){
      voice.playbackRate = 1;
    }
  }

  raf = requestAnimationFrame(tick);
}

// Листать текст руками — колесом и клавишами. Без этого до начала длинной
// песни добираешься только перемоткой звука.
let freeScroll = 0, scrollY = 0;
function stageScroll(dy){
  const stage = $("stage");
  const max = Math.max(0, scroll.scrollHeight - stage.clientHeight);
  scrollY = clamp(scrollY + dy, 0, max);
  scroll.style.transition = "none";
  scroll.style.transform = "translateY(" + (-scrollY) + "px)";
  freeScroll = Date.now();
}
$("stage").addEventListener("wheel", e => {
  e.preventDefault();
  stageScroll(e.deltaY * (e.deltaMode === 1 ? 24 : 1));
}, {passive:false});

function centerLine(idx, pair){
  if (Date.now() - freeScroll < 2500) return;   // человек листает сам
  scroll.style.transition = "";
  // Поют двое — держим в центре середину пары, иначе вторая строка уезжает
  // за край и её не прочитать.
  if (pair && pair.length > 1){
    const els = pair.map(i => lineEls[i] && lineEls[i].el).filter(Boolean);
    if (els.length > 1){
      const top = Math.min(...els.map(e => e.offsetTop));
      const bot = Math.max(...els.map(e => e.offsetTop + e.offsetHeight));
      scrollY = (top + bot) / 2 - $("stage").clientHeight / 2;
      scroll.style.transform = "translateY(" + (-scrollY) + "px)";
      return;
    }
  }
  // До начала пения показываем первую строку по центру сцены. Раньше здесь
  // сбрасывалось смещение в ноль, а отступ у текста задан в долях ОКНА —
  // сцена же короче окна, особенно с открытой панелью правки. Из-за этого при
  // открытии страницы текста было не видно вовсе.
  if (idx < 0) idx = 0;
  if (!lineEls[idx]){ scroll.style.transform = "translateY(0)"; return; }
  const el = lineEls[idx].el;
  scrollY = el.offsetTop + el.offsetHeight / 2 - $("stage").clientHeight / 2;
  scroll.style.transform = "translateY(" + (-scrollY) + "px)";
}

/* ---------- транспорт ---------- */
let wantPlaying = false;   // намерение пользователя, а не текущее состояние тега
let lastRevive = 0;
function mediaTime(){
  if (engine === "wa")
    return waOn ? Math.min(Math.max(waOffset + (ctx.currentTime - waStart), waOffset), dur)
                : waOffset;
  return master ? master.currentTime : 0;
}

function waStop(){
  if (!srcs) return;
  srcs.forEach(s => { try { s.onended = null; s.stop(); } catch (e) {} });
  srcs = null;
}
function waPlayFrom(t){
  waStop();
  t = clamp(t, 0, Math.max(dur - 0.02, 0));
  srcs = bufs.map((b, i) => {
    const s = ctx.createBufferSource();
    s.buffer = b;
    s.connect(gains[i]);
    return s;
  });
  const at = ctx.currentTime + 0.03;      // общий момент старта для обеих дорожек
  srcs.forEach(s => s.start(at, t));
  srcs[0].onended = () => {
    // Дорожки кодируются отдельно, и у mp3-кодера padding не всегда совпадает
    // бит-в-бит — если вторая дорожка на миллисекунды длиннее первой, она бы
    // доигрывала одна в тишине. Глушим явно все источники, а не только первый.
    if (waOn && mediaTime() >= dur - 0.2){
      waOn = false; waOffset = dur; wantPlaying = false; syncIcon();
    }
    waStop();
  };
  waStart = at; waOffset = t; waOn = true;
}

function play(){
  wantPlaying = true;
  syncIcon();
  if (engine === "loading"){ pendingPlay = true; return; }
  if (engine === "wa"){
    if (ctx.state === "suspended" && ctx.resume) ctx.resume();
    if (waOffset >= dur - 0.05) waOffset = 0;      // с конца — начинаем заново
    waPlayFrom(waOffset);
    return;
  }
  // обе дорожки запускаем синхронно, внутри обработчика нажатия: если
  // отложить второй play() в .then(), Safari на iPhone сочтёт его
  // «не жестом пользователя» и заблокирует — вокал молча не заиграет
  if (voice) voice.currentTime = master.currentTime;
  const pm = master.play();
  const pv = voice ? voice.play() : null;
  if (pv && pv.catch) pv.catch(() => {});
  if (pm && pm.catch) pm.catch(() => toast(T.blocked));
}
function pause(){
  wantPlaying = false; syncIcon();
  pendingPlay = false;
  if (engine === "wa"){ waOffset = mediaTime(); waOn = false; waStop(); return; }
  if (master) master.pause();
  if (voice) voice.pause();
}
// Смотрим на намерение, а не на состояние тега: во время перемотки элемент
// стоит на паузе, и по нему выходило, что нажатие «пауза» должно запускать звук.
function toggle(){ wantPlaying ? pause() : play(); }

function syncIcon(){
  document.body.classList.toggle("playing", wantPlaying);
  $("icPlay").style.display = wantPlaying ? "none" : "";
  $("icPause").style.display = wantPlaying ? "" : "none";
}
let seekTok = 0;
function seekTo(t){
  t = clamp(t, 0, dur || t);
  curIdx = -2;

  if (engine === "wa"){
    // одна общая точка старта для обеих дорожек — расходиться нечему
    waOffset = t;
    if (wantPlaying && !dragging) waPlayFrom(t);
    else { waOn = false; waStop(); }
    return;
  }
  // звук ещё грузится — запомним и применим, когда движок поднимется
  if (engine === "loading"){ pendingSeek = t; return; }
  if (!voice){ master.currentTime = t; return; }

  // Две дорожки перематываются не мгновенно и не синхронно, а MP3 ещё и
  // позиционируется приблизительно. Если просто задать обеим currentTime, одна
  // доигрывает старое место, пока вторая играет новое — слышно как эхо.
  // Поэтому: остановить обе, дождаться перемотки у обеих, выровнять, запустить.
  const tok = ++seekTok;
  master.pause(); voice.pause();
  master.playbackRate = voice.playbackRate = 1;
  master.currentTime = t;
  voice.currentTime = t;

  // Готовность именно опрашиваем, а не ждём события «seeked»: событие от прошлой
  // перемотки может прийти уже после начала новой, и тогда звук запустится
  // раньше времени — обе дорожки заиграют вразнобой.
  const began = Date.now();
  const check = () => {
    if (tok !== seekTok) return;                       // подоспела более свежая
    if (master.seeking || voice.seeking){
      if (Date.now() - began < 1500){ setTimeout(check, 25); return; }
    }
    // спрашиваем намерение на момент готовности, а не на момент начала перемотки:
    // иначе пауза, нажатая пока шла перемотка, была бы отменена
    if (wantPlaying && !dragging) play();
  };
  setTimeout(check, 25);
}
/* ---------- запуск звукового движка ---------- */
function initElements(){
  const mk = src => { const a = new Audio(); a.src = src; a.preload = "auto"; return a; };
  master = mk(stems ? P.audio.instrumental : P.audio.mix);
  voice = stems ? mk(P.audio.vocals) : null;
  if (voice) voice.volume = 0;
  master.addEventListener("ended", () => { wantPlaying = false; syncIcon();
    if (voice) voice.pause(); });
  master.addEventListener("loadedmetadata", () => {
    if (isFinite(master.duration) && master.duration > 0) dur = master.duration;
    $("tDur").textContent = fmt(dur);
  });
  engine = "el";
}

function initWebAudio(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return Promise.reject(new Error(T.noAudio));
  ctx = new AC();
  const urls = stems ? [P.audio.instrumental, P.audio.vocals] : [P.audio.mix];
  return Promise.all(urls.map(u => fetch(u).then(r => r.arrayBuffer())))
    .then(raw => Promise.all(raw.map(b => new Promise((res, rej) => {
      const p = ctx.decodeAudioData(b, res, rej);
      if (p && p.then) p.then(res, rej);
    }))))
    .then(decoded => {
      bufs = decoded;
      gains = bufs.map(() => { const g = ctx.createGain(); g.connect(ctx.destination); return g; });
      dur = bufs[0].duration;
      engine = "wa";
    });
}

initWebAudio().catch(() => {
  // не вышло — работаем на отдельных элементах, как раньше
  if (ctx && ctx.close) { try { ctx.close(); } catch (e) {} }
  ctx = null; bufs = null; gains = null;
  try { initElements(); }
  catch (e) { toast(T.badAudio); }
}).then(() => {
  if (engine === "loading") return;            // звук поднять не удалось
  $("tDur").textContent = fmt(dur);
  setVocal(vocalLevel);
  if (pendingSeek !== null){ const t = pendingSeek; pendingSeek = null; seekTo(t); }
  if (pendingPlay){ pendingPlay = false; play(); }
});

/* ---------- ползунки ---------- */
// Куски, где голос из записи оставлен нарочно: подпевка, речь, важный для
// сюжета момент. Петь их не нужно — там играет оригинал, что бы ни стоял
// ползунок «Голос».
let keepOn = false;
function ramp(param, v){
  if (param.setTargetAtTime) param.setTargetAtTime(v, ctx.currentTime, 0.03);
  else param.value = v;
}
function inKeep(t){
  for (let i = 0; i < lines.length; i++)
    if (lines[i].keep && lines[i].start - 0.12 <= t && t < lines[i].end + 0.12) return true;
  return false;
}
function applyVocal(){
  const lvl = keepOn ? 1 : vocalLevel;
  if (engine === "wa" && gains){
    gains[0].gain.value = 1;
    // Плавно: скачок громкости на границе строки слышен щелчком.
    // Плавно, если движок умеет; иначе просто ставим значение.
    if (stems) ramp(gains[1].gain, lvl);
  } else if (voice) voice.volume = lvl;
}
function setVocal(v){
  vocalLevel = clamp(v, 0, 1);
  applyVocal();
  $("rVocal").value = Math.round(vocalLevel*100);
  $("vVocal").textContent = Math.round(vocalLevel*100) + "%";
}
function setOffset(ms){
  offset = clamp(ms, -3000, 3000) / 1000;
  $("rOffset").value = Math.round(offset*1000);
  $("vOffset").textContent = (offset >= 0 ? "+" : "") + offset.toFixed(3) + T.sec;
  curIdx = -2; shownTarget = -2; save();     // подпись цели показывает время со сдвигом
}
$("rVocal").addEventListener("input", e => setVocal(e.target.value/100));
$("rOffset").addEventListener("input", e => setOffset(+e.target.value));

const seek = $("seek");
let dragging = false;
function seekAt(clientX){
  const r = seek.getBoundingClientRect();
  seekTo(clamp((clientX - r.left) / r.width, 0, 1) * dur);
}
seek.addEventListener("pointerdown", e => {
  dragging = true;
  try { seek.setPointerCapture(e.pointerId); } catch (err) {}   // есть не везде
  seekAt(e.clientX);
});
// Слушаем всё окно, а не саму полосу: мышь часто отпускают уже за её пределами,
// и тогда флаг «тащим» залипал бы навсегда — музыка больше не запустилась бы.
window.addEventListener("pointermove", e => { if (dragging) seekAt(e.clientX); });
// пока тащим — звук не запускаем; играть начинаем один раз, когда отпустили
window.addEventListener("pointerup", e => {
  if (!dragging) return;
  dragging = false;
  seekAt(e.clientX);
});
window.addEventListener("pointercancel", () => {
  if (!dragging) return;
  dragging = false;
  seekTo(mediaTime());
});

$("btnPlay").addEventListener("click", toggle);

// Страница собрана на одном языке, а открыть её могут где угодно. Переключатель
// меняет надписи на месте и запоминает выбор для этой песни.
function setLang(code){
  if (!STR[code] || code === LANG) return;
  LANG = code; T = STR[LANG];
  document.documentElement.lang = LANG;
  try { localStorage.setItem(LANG_KEY, LANG); } catch (e) {}
  applyLang();
  labelLang();
  build();                      // в строках есть надпись «поёт оригинал»
  curIdx = -2; shownTarget = -2;
  centerLine(curIdx);
  toast(T.langSwitched);
}
// На кнопке — язык, НА КОТОРЫЙ переключит: так понятнее, чем текущий.
function labelLang(){ $("btnLang").textContent = LANG === "ru" ? "EN" : "RU"; }
labelLang();
$("btnLang").addEventListener("click", () => setLang(LANG === "ru" ? "en" : "ru"));

$("btnFull").addEventListener("click", () => {
  document.fullscreenElement ? document.exitFullscreen()
                             : document.documentElement.requestFullscreen?.();
});
const SIZES = ["clamp(29px,5.8vw,65px)","clamp(34px,7.1vw,82px)","clamp(23px,4.5vw,50px)"];
$("btnSize").addEventListener("click", () => {
  sizeStep = (sizeStep + 1) % SIZES.length;
  document.documentElement.style.setProperty("--stage-size", SIZES[sizeStep]);
  setTimeout(() => centerLine(curIdx), 60);
});

/* ---------- режим правки ---------- */
let tapping = false, tapIdx = 0;
$("btnEdit").addEventListener("click", e => {
  const open = $("editor").classList.toggle("open");
  e.currentTarget.classList.toggle("on", open);
  document.body.classList.toggle("editing", open);   // метка цели только при правке
  centerLine(curIdx);            // сцена стала ниже — текст надо доцентровать
});
function snapshot(){ history.push(JSON.stringify(lines)); if (history.length > 250) history.shift(); }

function tapLabel(){
  $("btnTap").textContent = tapping
    ? T.tapOn(Math.min(tapIdx + 1, lines.length), lines.length)
    : T.tapOff;
  $("tapRow").classList.toggle("hide", !tapping);   // стену текста показываем по делу
}

$("btnTap").addEventListener("click", () => {
  tapping = !tapping;
  document.body.classList.toggle("tapping", tapping);
  $("btnTap").classList.toggle("on", tapping);
  if (tapping){
    snapshot();
    tapIdx = 0;
    pause();                    // размечать имеет смысл с самого начала песни
    seekTo(0);
    toast(T.tapHow);
  } else { save(); toast(T.tapSaved); }
  tapLabel();
  curIdx = -2;
});

function tap(){
  if (tapIdx >= lines.length){ toast(T.allTapped); return; }
  const t = currentTime();
  snapshot();                                 // чтобы каждый тап можно было отменить
  const ln = lines[tapIdx];
  ln.start = t;
  if (tapIdx > 0){                            // закрыть предыдущую строку
    const prev = lines[tapIdx-1];
    prev.end = Math.max(prev.start + 0.3, t - 0.05);
    spreadWords(prev);
  }
  ln.end = Math.max(t + 0.5, ln.end);
  spreadWords(ln);
  tapIdx++;
  if (tapIdx >= lines.length) toast(T.tapDone);
  tapLabel();
  curIdx = -2;
}

function startFrom(i){
  tapIdx = clamp(i, 0, lines.length - 1);
  seekTo(Math.max(0, (lines[tapIdx].start || 0) - 1.5));
  tapLabel();
  curIdx = -2;
  toast(T.tapFrom(tapIdx + 1));
}

function untap(){
  if (!tapping || !tapIdx || !history.length){ toast(T.nothingToUndo); return; }
  lines = JSON.parse(history.pop());
  tapIdx--;
  build();
  tapLabel();
  curIdx = -2;
  toast(T.backTo(tapIdx + 1));
}

function spreadWords(ln){
  const total = ln.words.reduce((s,w) => s + (w.s||1), 0) || 1;
  let acc = 0;
  const span = Math.max(ln.end - ln.start, 0.3);
  ln.words.forEach(w => {
    w.t = ln.start + span * acc / total;
    acc += (w.s || 1);
    w.d = ln.start + span * acc / total - w.t;
  });
}

// Какую строку правят кнопки. Угадывать нельзя: во время проигрыша одинаково
// осмысленно и подправить только что спетую строку, и подготовить следующую.
// Поэтому по умолчанию правим ТУ, ЧТО ВИДНО подсвеченной, а сдвинуть цель на
// соседнюю можно кнопками ◀ ▶ — и выбранная строка подчёркивается на экране.
// pinned >= 0 — строку выбрали руками (щелчком или ◀ ▶), и цель больше никуда
// не убегает, пока играет песня. Это и есть порядок работы: выбрал строку,
// доиграл до нужного места, нажал «сюда». Без закрепления к моменту нажатия
// подсвечена уже другая строка, и правка уходит не туда.
let pinned = -1;
function activeLine(){
  if (pinned >= 0) return clamp(pinned, 0, lines.length - 1);
  let base = curIdx >= 0 ? curIdx : findLine(currentTime());
  if (base < 0) base = lines.length ? 0 : -1;       // ещё вступление — правим первую
  return base;
}
function pinLine(i){
  pinned = clamp(i, 0, lines.length - 1);
  refreshTarget(true);
}
function unpin(){
  pinned = -1;
  refreshTarget(true);
}
function nudgeTarget(d){
  const before = activeLine();
  if (before < 0) return;
  const after = clamp(before + d, 0, lines.length - 1);
  if (after === before) return;                     // упёрлись в край списка
  pinLine(after);
}

function shiftLines(from, dt, toEnd){
  if (from < 0) { toast(T.playFirst); return; }
  snapshot();
  const last = toEnd ? lines.length - 1 : from;
  for (let k = from; k <= last; k++){
    lines[k].start += dt; lines[k].end += dt;
    lines[k].words.forEach(w => w.t += dt);
  }
  curIdx = -2; save();
  toast(toEnd ? T.movedRest(from + 1, dt) : T.movedOne(from + 1, dt));
}
// Показать, какая строка сейчас под правкой: подписью и подчёркиванием на сцене.
function refreshTarget(force){
  const i = activeLine();
  if (i === shownTarget && !force) return;
  if (shownTarget >= 0 && lineEls[shownTarget]) lineEls[shownTarget].el.classList.remove("tgt");
  shownTarget = i;
  if (i >= 0 && lineEls[i]){
    lineEls[i].el.classList.add("tgt");
    $("tgtName").textContent =
      `${i + 1}. [${fmtMs(lines[i].start + offset)}] ${lines[i].text}`;
  } else {
    $("tgtName").textContent = "—";
  }
  // Закреплённая строка не должна стать ловушкой: видно, что цель держат руками,
  // и рядом же — как вернуть её к песне.
  $("btnUnpin").classList.toggle("hide", pinned < 0);
  $("tgtRow").classList.toggle("held", pinned >= 0);
}
$("btnTgtPrev").addEventListener("click", () => nudgeTarget(-1));
$("btnTgtNext").addEventListener("click", () => nudgeTarget(1));
$("btnUnpin").addEventListener("click", () => { unpin(); toast(T.unpinned); });

// Одно понятное действие вместо четырёх кнопок сдвига: доиграли до места, где
// строку начинают петь, и нажали. Флажок решает, ехать ли остатку песни следом.
function restToo(){ return $("chkRest").checked; }
$("btnHere").addEventListener("click", () => {
  const i = activeLine();
  if (i < 0){ toast(T.playFirst); return; }
  shiftLines(i, currentTime() - lines[i].start, restToo());
});
$("btnUndo").addEventListener("click", () => {
  if (!history.length){ toast(T.nothingToUndo); return; }
  lines = JSON.parse(history.pop());
  build(); curIdx = -2; save(); toast(T.undone);
});
$("btnReset").addEventListener("click", () => {
  snapshot();
  lines = D.lines.map(l => ({...l, words: l.words.map(w => ({...w}))}));
  setOffset(0); build(); curIdx = -2;
  localStorage.removeItem(KEY);
  toast(T.resetDone);
});

/* ---------- сохранение / экспорт ---------- */
let booted = false, hadStored = false;
function save(){
  // До конца запуска не пишем ничего: иначе страница сохраняет саму себя ещё
  // до единой правки, и при следующем открытии честно сообщает «открыты ваши
  // правки» — про правки, которых человек не делал.
  if (!booted) return;
  try { localStorage.setItem(KEY, JSON.stringify({offset: offset*1000, lines})); } catch(e){}
  // Правки живут в браузере. Пока страница не пересохранена, видео и другой
  // компьютер о них не знают — поэтому кнопку сохранения подсвечиваем.
  markUnsaved(true);
}
function markUnsaved(on){
  if (!booted) return;          // при открытии страницы правок ещё нет
  const b = $("btnSavePage");
  b.classList.toggle("on", on);
  b.textContent = on ? T.saveUnsaved : T.savePage;
}
function restore(){
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || "null");
    // структура должна совпадать до последнего слова, иначе подсветка разъедется
    const fits = s && Array.isArray(s.lines) && s.lines.length === lines.length &&
      s.lines.every((l, i) => l.words && l.words.length === lines[i].words.length);
    if (fits){
      lines = s.lines; hadStored = true; setOffset(s.offset || 0);
      toast(T.restored);
    } else if (s){
      localStorage.removeItem(KEY);
    }
  } catch(e){}
}
function download(name, text, mime){
  const blob = new Blob([text], {type: mime || "text/plain;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
$("btnSaveJson").addEventListener("click", () => {
  const out = {version: 1, title: D.title, artist: D.artist, offset: offset,
               lines: lines.map(l => ({text: l.text, start: +(l.start+offset).toFixed(3),
                                       end: +(l.end+offset).toFixed(3), section: l.section,
                                       words: l.words.map(w => ({w: w.w, t: +(w.t+offset).toFixed(3),
                                                                 d: +w.d.toFixed(3), s: w.s}))}))};
  download("timings.json", JSON.stringify(out, null, 1), "application/json");
  toast(T.jsonSaved);
});
// Сохранить саму страницу с вшитой разметкой. Иначе правки остаются только в
// браузере, и рендер видео берёт из файла исходные — машинные — тайминги.
$("btnSavePage").addEventListener("click", () => {
  const baked = lines.map(l => ({
    text: l.text, section: l.section,
    start: +(l.start + offset).toFixed(3), end: +(l.end + offset).toFixed(3),
    words: l.words.map(w => ({w: w.w, t: +(w.t + offset).toFixed(3),
                              d: +w.d.toFixed(3), s: w.s})),
  }));
  let h = 0;                                    // свой ключ хранения для новой страницы
  baked.forEach(l => { h = (h * 31 + Math.round(l.start * 100)) | 0; });

  const P2 = {...P, id: (P.id + "e" + (h >>> 0).toString(36)).slice(0, 24),
              edited: true,                     // рендер видео поймёт, что правки уже внутри
              data: {...D, lines: baked}};

  const root = document.documentElement.cloneNode(true);
  root.querySelector("#scroll").innerHTML = "";  // разметку страница строит сама
  root.querySelector("#editor").classList.remove("open");
  // клон снят с живой страницы — вычищаем состояние текущего сеанса, иначе
  // сохранённый файл откроется «играющим», в режиме тапов или с висящим тостом
  // чистим состояние сеанса по элементам, которые точно есть
  const reset = (id, fn) => { const e = root.querySelector(id); if (e) fn(e); };
  reset("body", e => e.className = "");
  reset("#btnTap", e => { e.className = ""; e.textContent = T.tapOff; });
  reset("#tapRow", e => e.classList.add("hide"));
  reset("#chkRest", e => e.checked = false);
  reset("#btnUnpin", e => e.className = "hide");
  reset("#btnSavePage", e => { e.className = ""; e.textContent = T.savePage; });
  reset("#tgtRow", e => e.className = "row");
  reset("#btnEdit", e => e.className = "");
  reset("#toast", e => e.className = "toast");
  root.querySelector("#payload").textContent =
    JSON.stringify(P2).replace(/</g, "\\u003c").replace(/>/g, "\\u003e")
                      .replace(/&/g, "\\u0026");

  const name = (D.title || "karaoke").replace(/[\\/:*?"<>|]/g, "_");
  download(name + (LANG === "ru" ? "_исправленное" : "_edited") + ".html",
           "<!DOCTYPE html>\n" + root.outerHTML,
           "text/html;charset=utf-8");
  markUnsaved(false);
  toast(T.savedOk);
});

$("btnSaveLrc").addEventListener("click", () => {
  const ts = t => { t = Math.max(0, t); const m = t/60|0, s = t-m*60;
    return "["+String(m).padStart(2,"0")+":"+s.toFixed(2).padStart(5,"0")+"]"; };
  let out = "";
  if (D.title)  out += "[ti:"+D.title+"]\n";
  if (D.artist) out += "[ar:"+D.artist+"]\n";
  out += lines.map(l => ts(l.start+offset)+l.text).join("\n") + "\n";
  download("lyrics.lrc", out, "text/plain;charset=utf-8");
});

/* ---------- клавиатура ---------- */
let toastT = 0;
function toast(msg){
  const el = $("toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 2200);
}
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" && e.key !== " ") return;
  switch(e.key){
    case " ":
      e.preventDefault();
      // в режиме тапов первый Пробел запускает песню, дальше каждый отмечает строку
      if (tapping) { wantPlaying ? tap() : play(); } else { toggle(); }
      break;
    case "Backspace": if (tapping){ e.preventDefault(); untap(); } break;
    case "[": e.preventDefault(); shiftLines(activeLine(), -0.05, restToo()); break;
    case "]": e.preventDefault(); shiftLines(activeLine(),  0.05, restToo()); break;
    case "Home": e.preventDefault(); freeScroll = 0; seekTo(0); break;
    case "End": e.preventDefault(); freeScroll = 0;
                seekTo(Math.max(0, (lines[lines.length-1] || {}).start || 0)); break;
    case "PageUp": e.preventDefault(); stageScroll(-$("stage").clientHeight*0.8); break;
    case "PageDown": e.preventDefault(); stageScroll($("stage").clientHeight*0.8); break;
    case "ArrowLeft":  e.preventDefault(); seekTo(mediaTime() - 5); break;
    case "ArrowRight": e.preventDefault(); seekTo(mediaTime() + 5); break;
    case "ArrowUp":    e.preventDefault(); setOffset(offset*1000 + 100); break;
    case "ArrowDown":  e.preventDefault(); setOffset(offset*1000 - 100); break;
    case "f": case "F": case "а": case "А": $("btnFull").click(); break;
    case "m": case "M": case "ь": case "Ь": setVocal(vocalLevel > 0 ? 0 : 1); break;
  }
});
$("stage").addEventListener("click", e => { if (tapping && e.target === $("stage")) tap(); });

// После клика мышью фокус остаётся на кнопке, и следующий Пробел срабатывает
// дважды: наша глобальная обработка + браузерная активация сфокусированной
// кнопки. Выглядит как «пробел не работает» (два переключения подряд) или
// как самопроизвольный выход из режима тапов. Снимаем фокус сразу.
document.addEventListener("click", e => {
  const b = e.target && e.target.closest && e.target.closest("button");
  if (b) b.blur();
});

/* ---------- старт ---------- */
$("mTitle").textContent = D.title || T.karaokeTitle;
$("mArtist").textContent = D.artist || "";
if (!stems){ $("grpVocal").style.display = "none"; }
$("tDur").textContent = fmt(dur);
build();
restore();
setVocal(vocalLevel);
setOffset(offset * 1000);
booted = true;
// Правки из прошлого захода лежат в браузере, а в самом файле их нет — значит
// подсветить кнопку надо сразу, а не ждать следующего движения.
if (hadStored) markUnsaved(true);
window.addEventListener("resize", () => centerLine(curIdx));
raf = requestAnimationFrame(tick);
})();
</script>
</body>
</html>
